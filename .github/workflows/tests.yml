name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    # the app's own tests: plain Python, no Blender. Windows, where Edge is there for the page test.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_app
